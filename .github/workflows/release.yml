name: Release a minor version
on:
  push:
    branches: [main]
# Keep all pending merges instead of replacing the previous pending run.
concurrency:
  group: org-preview-main-releases
  cancel-in-progress: false
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  queue: max
permissions:
  contents: read
jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs plan
  build:
    needs: plan
    if: needs.plan.outputs.published != 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
  publish:
    needs: [plan, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.published != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: org-preview-*
          merge-multiple: true
          path: release
      - name: Verify packages, tag the versioned source, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.plan.outputs.source }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release.mjs publish
